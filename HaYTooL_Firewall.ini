; Bu dosya insan tarafindan kolayca okunabilir ve elle duzenlenebilir.
; Degisiklik yapmadan once uygulamanin kapali oldugundan emin olunuz.

[Settings]
; [TR] FullSafe (Sifir Guven / Zero-Trust) Modu (True / False).
; [EN] FullSafe (Zero-Trust) Mode (True / False).
FullSafeMode=False

; [TR] Arayuz ve CLI varsayilan dili (TR, EN, ES, DE, PT, AR, RU).
; [EN] Default UI and CLI language (TR, EN, ES, DE, PT, AR, RU).
Language=TR

; [TR] GitHub Personal Access Token (Gist bulut yedekleme icin DPAPI sifreli saklanir).
; [EN] GitHub Personal Access Token (DPAPI encrypted for Gist cloud backup).
GitHub=ENC:

; [TR] Ozel VirusTotal v3 API Anahtari (Bos birakilirsa dahili korumali anahtarlar kullanilir).
; [EN] Custom VirusTotal v3 API Key (If left empty, built-in protected keys are used).
VirusTotalApiKey=

; [TR] Son senkronize edilen GitHub Gist ID degeri.
; [EN] Last synchronized GitHub Gist ID.
LastGistId=3a5294ce68996ba0fea18d8225a46695

; [TR] Son senkronize edilen GitHub Gist web baglantisi.
; [EN] Last synchronized GitHub Gist web URL.
LastGistUrl=https://gist.github.com/HaYToKoRaZ/3a5294ce68996ba0fea18d8225a46695

; [TR] Uygulama acilisinda otomatik Gist bulut senkronizasyonu (True / False).
; [EN] Automatic Gist cloud sync on application startup (True / False).
AutoGistOnStartup=True

; [TR] Uygulama acilisinda yerel 7z arsiv yede alma (True / False).
; [EN] Automatic local 7z archive backup on startup (True / False).
AutoBackupOnStartup=True

; [TR] Saklanacak maksimum yerel 7z yedek arsiv sayisi.
; [EN] Maximum local 7z backup archives to retain.
MaxBackupCount=30

; [TR] Bellekte ve log dosyasinda tutulacak maksimum gunluk satiri.
; [EN] Maximum log lines to keep in memory and log file.
MaxLogLines=2000

; [TR] Secili arayuz temasi (Dark, Light, Discord, YouTube).
; [EN] Active user interface theme (Dark, Light, Discord, YouTube).
Theme=Dark

